name: 打造我的安卓 AI 聊天软件
on:
  workflow_dispatch: # 允许手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest # 云端 Linux 机器
    steps:
      - name: 把代码搬下来
        uses: actions/checkout@v4

      - name: 安装 Java 17 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 配置 Android SDK 并安装 NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.3.13750724" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 给打包工具赋予执行权限
        run: chmod +x geniex_chat_android/gradlew

      - name: 开始打包 APK
        run: |
          cd geniex_chat_android
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: 把打包好的 APK 传给我
        uses: actions/upload-artifact@v4
        with:
          name: my-genie-apk
          path: geniex_chat_android/build/outputs/apk/debug/app-debug.apk
