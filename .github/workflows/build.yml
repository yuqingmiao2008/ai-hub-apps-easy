name: 打造我的安卓 AI 聊天软件

on:
  workflow_dispatch: # 这行代码的意思是：允许你手动点击按钮触发打包

jobs:
  build:
    runs-on: ubuntu-latest # 告诉云端电脑：给我开一台 Linux 系统的机器

    steps:
      - name: 把代码搬下来
        uses: actions/checkout@v4

      - name: 安装 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 开始打包 APK！
        run: |
          cd geniex_chat_android  # 进入高通聊天软件的文件夹
          chmod +x ./gradlew      # 给打包工具赋予执行权限
          ./gradlew assembleDebug # 启动打包流水线！

      - name: 把打包好的 APK 传给我
        uses: actions/upload-artifact@v4
        with:
          name: my-genie-apk
          path: geniex_chat_android/app/build/outputs/apk/debug/app-debug.apk
