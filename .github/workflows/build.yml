name: Build GenieX Chat APK

on:
  workflow_dispatch:
  push:
    branches: [ release ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK and NDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "ndk;27.3.13750724" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Make gradlew executable
        run: chmod +x geniex_chat_android/gradlew

      - name: Build debug APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd geniex_chat_android
          # Maven Central throttles the shared IP ranges of hosted runners with
          # HTTP 429. That aborts Gradle during configuration — before a single
          # source file is looked at — so a red build here says nothing about
          # the code. Retry with a short backoff; the Gradle cache in ~/.gradle
          # persists across attempts, so each retry needs fewer downloads.
          for attempt in 1 2 3; do
            echo "::group::gradle attempt ${attempt} of 3"
            if ./gradlew assembleDebug --no-daemon; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 3 ]; then
              echo "build failed; retrying after backing off"
              sleep $((attempt * 45))
            fi
          done
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-genie-apk
          path: geniex_chat_android/build/outputs/apk/debug/app-debug.apk

  # Artifacts require a GitHub login and expire after 90 days, so the APK is
  # also published as a release asset — that gives a public, login-free
  # download link that does not rot.
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: my-genie-apk
          path: apk

      - name: Rename APK with build number
        run: |
          mkdir -p dist
          cp apk/app-debug.apk "dist/geniex-chat-v1.0.${GITHUB_RUN_NUMBER}.apk"
          # A second copy under a fixed name, so one permanent link always
          # resolves to the newest build:
          #   .../releases/latest/download/geniex-chat-latest.apk
          cp apk/app-debug.apk "dist/geniex-chat-latest.apk"
          ls -lh dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v1.0.${GITHUB_RUN_NUMBER}"
          # A re-run reuses its run number, so drop a stale release first
          # instead of failing on "tag already exists".
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "GenieX Chat v1.0.${GITHUB_RUN_NUMBER}" \
            --generate-notes \
            --latest \
            dist/*.apk
          echo "published $tag"
